{% extends "base.html" %}
{% block title %}WebSSH 受限终端{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="/static/xterm.css">
<style>
  #ssh-info { background: #1e293b; color: #e2e8f0; padding: 0.5rem 0.75rem;
              display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  #ssh-info code { background: #0f172a; padding: 0.1rem 0.4rem; border-radius: 4px; }
  #terminal { padding: 0.5rem; background: #0f172a; }
  #ssh-status { color: #94a3b8; font-size: 0.85rem; }
</style>
{% endblock %}
{% block content %}
<h1>WebSSH 受限终端</h1>
<p class="muted">
  <a href="javascript:history.back()">&larr; 返回</a> ·
  仅限当前任务工作树 <code>{{ worktree }}</code>，会话 30 分钟空闲超时、断开即回收。
</p>
<div id="ssh-info">
  <code>{{ worktree }}</code>
  <span id="ssh-status">连接中…</span>
  <span style="flex:1"></span>
  <button type="button" id="ssh-close">关闭终端</button>
</div>
<div id="terminal"></div>
<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
(function () {
  var wsUrl = "{{ ws_url }}";
  var proto = location.protocol === "https:" ? "wss://" : "ws://";
  var status = document.getElementById("ssh-status");
  var term = new Terminal({ fontSize: 13, cursorBlink: true, scrollback: 2000 });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));
  fit.fit();

  // ttyd 1.7 客户端协议（已对真实 ttyd 实测，见 TestRealTtydProtocol）：
  //   服务端 → 客户端：帧首字节 '0'=输出 '1'=设置标题 '2'=偏好设置
  //   客户端 → 服务端：'0'=输入 '1'=resize；首条消息必须是握手 JSON
  // ttyd 只在收到握手 JSON 时才 spawn shell —— 不发它就会“连上但永远无输出”。
  var CMD_OUTPUT = 0x30; // '0'
  var encoder = new TextEncoder();
  var decoder = new TextDecoder();

  function sendHandshake() {
    ws.send(JSON.stringify({
      AuthToken: "",
      columns: term.cols,
      rows: term.rows,
    }));
  }

  function sendResize() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send("1" + JSON.stringify({ columns: term.cols, rows: term.rows }));
    }
  }

  var ws;
  function connect() {
    ws = new WebSocket(proto + location.host + wsUrl);
    // 必须显式声明，否则二进制帧到达时是 Blob，term.write 无法渲染
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      status.textContent = "已连接";
      fit.fit();
      sendHandshake();
      sendResize();
      term.focus();
    };
    ws.onmessage = function (ev) {
      var buf = new Uint8Array(ev.data);
      if (buf.length === 0) { return; }
      // 非输出帧（'1' 标题 / '2' 偏好）必须忽略，否则会被当作终端内容写进屏幕
      if (buf[0] === CMD_OUTPUT) {
        term.write(decoder.decode(buf.subarray(1)));
      }
    };
    ws.onclose = function (ev) {
      status.textContent = "连接已断开（" + ev.code + "）";
    };
    ws.onerror = function () {
      status.textContent = "连接异常";
    };
  }
  term.onData(function (data) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      // '0' = INPUT 命令字节；实测不带前缀的裸输入 ttyd 完全不执行
      ws.send(encoder.encode("0" + data));
    }
  });

  window.addEventListener("resize", function () {
    try { fit.fit(); } catch (e) {}
    sendResize();
  });

  document.getElementById("ssh-close").addEventListener("click", function () {
    fetch("/api/ssh/close", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ _csrf: "{{ csrf }}", token: "{{ token }}" }),
    }).then(function () {
      window.location.href = "/";
    });
  });

  connect();
})();
</script>
{% endblock %}
