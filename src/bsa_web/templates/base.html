<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BSA 分支维护工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <span class="brand">BSA 分支维护工作台</span>
    <nav>
      <a href="/">工作台</a>
      <a href="/history">历史</a>
      <a href="/audit">操作日志</a>
    </nav>
    <span class="spacer"></span>
    <span class="user">当前用户：{{ user.username }}（{{ user.role }}）</span>
    <form method="post" action="/logout">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <button type="submit">登出</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
