# 安全红线（数据驱动，决策 19）。SafetyEnforcer 通用校验器强制执行，LLM 不可覆盖。
# 型号（required_models）是编译型号的唯一权威源（问题 14 定案）。
forbidden_paths:
  - 'config/'
  - 'secrets.yaml'
  - '.env'
required_models:
  # 编译型号（RTL9617C_build.sh 的有效参数，真机测试校准）。
  # 格式 <型号>_<运营商>：如 2600_CMCC（移动）→ RTL9617C_build_cmcc.sh。
  # config 文件为 2600_CMCC.config 等，必须指定运营商才能生成配置。
  - '2600_CMCC'
forbidden_branches:
  - 'master'
  - 'main'
  - 'br_qa'
  - 'br_production'
max_single_edit_lines: 200
