# bsa-web nginx 配置（443 TLS 反代 → 127.0.0.1:8888）
#
# 部署位置：/etc/nginx/conf.d/bsa-web.conf（被 http 块 include，limit_req_zone 属 http 上下文）
# 替换占位：
#   <BSA_HOST>             → 实际域名，如 workbench.example.com
#   /etc/nginx/ssl/<BSA_HOST>.crt/.key → 实际 TLS 证书路径（建议 acme/certbot 托管）
# 使用：nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=bsa_login:10m rate=1r/5s;

# http → https 强制跳转
server {
    listen 80;
    server_name <BSA_HOST>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <BSA_HOST>;

    ssl_certificate     /etc/nginx/ssl/<BSA_HOST>.crt;
    ssl_certificate_key /etc/nginx/ssl/<BSA_HOST>.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 登录路径防爆破：同 IP 每 5s 放行 1 次，突发 5，超限 429
    location = /login {
        limit_req zone=bsa_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：供 systemd/监控探活，不做登录限速
    location = /healthz {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
