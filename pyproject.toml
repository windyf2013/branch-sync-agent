[project]
name = "bsa"
version = "0.1.0"
description = "Branch Sync Agent — 自动分支同步与编译验证"
readme = "README.md"
authors = [
    { name = "yangfu", email = "yangfu@raisecom.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=4.0",
    "fastapi>=0.115",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
bsa = "bsa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# examples/ 是参考实现，其测试依赖参考环境，不纳入本项目测试套件

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
